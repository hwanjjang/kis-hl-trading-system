[project]
name = "kis-hl-trading-system"
version = "0.1.0"
description = "KIS market data collector and Hyperliquid trading CLI for BTC/USDC and trade.xyz RWA assets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hyperliquid-python-sdk",
  "websocket-client",
]

[project.scripts]
kis-hl = "kis_hl.cli:main"

[tool.setuptools.packages.find]
include = ["kis_hl*"]
