name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install runtime dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Unit and regression tests
        run: python3 -m unittest discover -s tests -t . -q
      - name: Offline CLI and SQLite smoke
        run: python3 scripts/smoke_protected_trading.py
      - name: Offline account audit and adjustment smoke
        run: python3 scripts/smoke_account_audit.py
      - name: Offline native trailing and manual handoff smoke
        run: PYTHONPATH=. python3 scripts/smoke_manual_handoff.py
